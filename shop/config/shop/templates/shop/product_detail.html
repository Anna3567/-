{% extends "core/base.html" %}
{% load static %}
{% block title %} Подробнее {% endblock %}
{% block content %}
<div class="d-flex gap-3 flex-wrap justify-content-center mx-auto" style="max-width: 300px;">
	<div class="d-flex flex-column align-items-start text-center border-0 rounded-4 text-nowrap px-4 py-4"
		 style="width: min-content; box-shadow: 0 0 5px #00000022;">
		<h1 class="text-wrap">{{pro.name}}</h1>
		<img width="340" src="{{pro.image.url}}" alt="">
		<span class="fs-2 fw-bold"> {{pro.price}} ₽</span>
		<a href="{% url 'order_create' product_id=pro.id %}" class="btn fs-4 btn-outline-secondary w-100 mt-3">Оформить заказ</a>
	</div>
</div>
{% endblock %}
